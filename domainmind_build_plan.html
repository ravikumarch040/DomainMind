
<h2 class="sr-only">DomainMind 14-week build plan — click each week to see daily tasks, deliverables, and technical decisions</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1rem 0;font-size:14px;color:var(--color-text-primary)}
.phases{display:flex;gap:0;margin-bottom:1.5rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.phase-tab{flex:1;padding:10px 6px;text-align:center;cursor:pointer;font-size:11px;font-weight:500;border-right:0.5px solid var(--color-border-tertiary);transition:background .15s;background:var(--color-background-primary);color:var(--color-text-secondary)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--color-background-secondary);color:var(--color-text-primary)}
.phase-tab .ph-label{display:block;font-size:10px;color:var(--color-text-tertiary);margin-top:2px;font-weight:400}
.weeks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(0,1fr));gap:8px;margin-bottom:1.25rem}
.wk{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;transition:border-color .15s;background:var(--color-background-primary)}
.wk:hover{border-color:var(--color-border-secondary)}
.wk.active{border-color:var(--color-border-primary);background:var(--color-background-secondary)}
.wk-num{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px}
.wk-title{font-size:12px;font-weight:500;color:var(--color-text-primary);line-height:1.4}
.detail-panel{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.detail-head{padding:1rem 1.25rem;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-head-left{}
.detail-wk-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px}
.detail-wk-title{font-size:16px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.detail-wk-goal{font-size:13px;color:var(--color-text-secondary);line-height:1.5}
.phase-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:var(--border-radius-md);white-space:nowrap;flex-shrink:0}
.detail-body{padding:1.25rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.section-lbl{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:8px}
.task-list{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--color-text-secondary);line-height:1.5}
.task-dot{width:5px;height:5px;border-radius:50%;background:var(--color-border-primary);margin-top:6px;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary)}
.chip-ai{font-size:11px;padding:3px 8px;border-radius:20px;border:0.5px solid var(--color-border-info);color:var(--color-text-info);background:var(--color-background-info)}
.deliverable{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px;font-size:12px;color:var(--color-text-secondary);margin-top:4px;line-height:1.5}
.deliverable strong{color:var(--color-text-primary);font-weight:500}
.nav-row{display:flex;justify-content:space-between;align-items:center;padding:12px 1.25rem;border-top:0.5px solid var(--color-border-tertiary)}
.nav-btn{font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary)}
.nav-btn:hover{background:var(--color-background-secondary)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.wk-counter{font-size:12px;color:var(--color-text-tertiary)}
.action-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 1.25rem;border-top:0.5px solid var(--color-border-tertiary)}
button.ask{font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary)}
button.ask:hover{background:var(--color-background-secondary)}
@media(max-width:500px){.detail-body{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <div class="phases" id="phases"></div>
  <div class="weeks-grid" id="weeks-grid"></div>
  <div class="detail-panel">
    <div class="detail-head">
      <div class="detail-head-left">
        <div class="detail-wk-label" id="d-label"></div>
        <div class="detail-wk-title" id="d-title"></div>
        <div class="detail-wk-goal" id="d-goal"></div>
      </div>
      <span class="phase-badge" id="d-badge"></span>

    <div class="detail-body">
      <div>
        <div class="section-lbl">Daily tasks</div>

      <div>
        <div class="section-lbl" style="margin-bottom:8px">Tech & tools</div>
        <div class="chips" id="d-chips" style="margin-bottom:14px"></div>

        <div class="deliverable" id="d-deliverable"></div>

    </div>

  </div>
</div>

<script>

      "Build comparison runner: evaluate same 50 questions against 4 systems — base LLM, fine-tuned only, RAG only, fine-tuned + RAG",
      "Store all eval results in PostgreSQL with run_id, model_version, metric_name, score — queryable history",
      "Auto-trigger eval run on every model checkpoint via GitHub Actions — fail CI if faithfulness drops below threshold"

    chips:["RAGAS","ROUGE","BERTScore","pytest","GitHub Actions","PostgreSQL"],
    aiChips:["RAGAS faithfulness","answer relevancy metric","context recall scoring"],
    deliverable:"<strong>Eval harness running automatically in CI</strong>, comparison table of all 4 systems across 5 metrics, results stored in DB, eval dashboard queryable via API."

const PHASE_WEEK_MAP = [0,0,1,1,2,2,2,3,3,4,4,5,5,6];

let current = 0;

function phaseForWeek(i){ return PHASE_WEEK_MAP[i]; }

function renderPhases(){
  const el = document.getElementById('phases');
  el.innerHTML = PHASES.map((p,i)=>`
    <div class="phase-tab ${phaseActive(i)?'active':''}" onclick="jumpPhase(${i})" style="${phaseActive(i)?'border-top:2px solid '+p.color:''}">
      ${p.label}<span class="ph-label">Wk ${p.weeks}</span>
    </div>`).join('');
}

function phaseActive(i){ return phaseForWeek(current)===i; }

function renderWeeksGrid(){
  const activePhase = phaseForWeek(current);
  const el = document.getElementById('weeks-grid');
  const cols = WEEKS.filter((_,i)=>phaseForWeek(i)===activePhase).length;
  el.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
  el.innerHTML = WEEKS.map((w,i)=>{
    if(phaseForWeek(i)!==activePhase) return '';
    const ph = PHASES[phaseForWeek(i)];
    return `<div class="wk ${i===current?'active':''}" onclick="select(${i})" style="${i===current?'border-color:'+ph.color:''}">
      <div class="wk-num" style="${i===current?'color:'+ph.color:''}">Week ${i+1}</div>
      <div class="wk-title">${w.title}</div>
    </div>`;
  }).filter(Boolean).join('');
}

function renderDetail(){
  const w = WEEKS[current];
  const ph = PHASES[phaseForWeek(current)];
  document.getElementById('d-label').textContent = `Week ${current+1} of 14`;
  document.getElementById('d-title').textContent = w.title;
  document.getElementById('d-goal').textContent = w.goal;
  const badge = document.getElementById('d-badge');
  badge.textContent = ph.label + ' phase';
  badge.style.background = ph.bg;
  badge.style.color = ph.text;
  document.getElementById('d-tasks').innerHTML = w.tasks.map(t=>`<div class="task"><div class="task-dot"></div><div>${t}</div></div>`).join('');
  document.getElementById('d-chips').innerHTML =
    w.aiChips.map(c=>`<span class="chip-ai">${c}</span>`).join('') +
    w.chips.map(c=>`<span class="chip">${c}</span>`).join('');
  document.getElementById('d-deliverable').innerHTML = w.deliverable;
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===WEEKS.length-1;
  document.getElementById('wk-counter').textContent = `${current+1} / ${WEEKS.length}`;
  document.getElementById('action-row').innerHTML = `
    <button class="ask" onclick="sendPrompt('Deep dive on DomainMind Week ${current+1}: ${w.title} — give me detailed code examples, specific implementation decisions, and common pitfalls to avoid')">Deep dive this week ↗</button>
    <button class="ask" onclick="sendPrompt('What are the hardest technical challenges in DomainMind Week ${current+1} (${w.title}) and how do I solve them?')">Key challenges ↗</button>
    <button class="ask" onclick="sendPrompt('Write the GitHub commit checklist for DomainMind Week ${current+1}: ${w.title} — what should be committed and how should I describe the PRs?')">Commit checklist ↗</button>
  `;
}

function select(i){ current=i; renderPhases(); renderWeeksGrid(); renderDetail(); }
function navigate(d){ if(current+d>=0&&current+d<WEEKS.length){ current+=d; renderPhases(); renderWeeksGrid(); renderDetail(); }}
function jumpPhase(p){
  const firstWeek = PHASE_WEEK_MAP.indexOf(p);
  if(firstWeek>=0) select(firstWeek);
}

renderPhases(); renderWeeksGrid(); renderDetail();
</script>
