name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pipelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff check domainmind tests
      - run: uv run pytest tests -v --ignore=tests/test_train_integration.py

  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi uvicorn httpx pydantic pydantic-settings qdrant-client sqlalchemy
      - run: python -c "from retrieval.main import app; from eval_service.main import app as e; print('ok')"
        working-directory: services
        env:
          PYTHONPATH: .

  eval-gate:
    runs-on: ubuntu-latest
    needs: [pipelines]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pydantic
      - name: Faithfulness gate (placeholder threshold)
        run: |
          python -c "
          import json
          from pathlib import Path
          p = Path('evals/golden_set.jsonl')
          assert p.exists(), 'golden set missing'
          lines = [l for l in p.read_text().splitlines() if l.strip()]
          assert len(lines) >= 1, 'golden set empty'
          print('Eval gate: golden set present,', len(lines), 'items')
          "
