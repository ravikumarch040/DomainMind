apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: domainmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: g5.2xlarge
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - /models/domainmind-merged
            - --served-model-name
            - domainmind
            - --tensor-parallel-size
            - "1"
            - --max-model-len
            - "4096"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model
              mountPath: /models
      volumes:
        - name: model
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: domainmind
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
