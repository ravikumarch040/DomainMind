apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: domainmind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: domainmind/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: domainmind
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
